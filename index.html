<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm Quest: Hero's Journey</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="An interactive RPG adventure game">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%233498db'><text y='.9em' font-size='90'>🗡️</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <style>
        #game-header h1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        #game-header .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        #realm-logo, #quest-logo {
            max-height: 100px;  
            object-fit: contain;
        }
        #realm-logo {
            position: absolute;
            top: -25px;  
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }
    </style>
</head>
<body>
    <main id="game-container" role="main" aria-label="Realm Quest Game">
        <header id="game-header" role="banner">
            <h1>
                <div class="logo-container">
                    <img id="realm-logo" src="/Realm.png" alt="Realm" />
                    <img id="quest-logo" src="/Quest.png" alt="Quest" />
                </div>
            </h1>
            <div id="player-stats" aria-live="polite">
                <span id="player-health" aria-label="Player Health">❤️ 100</span>
                <span id="player-level" aria-label="Player Level">🔱 Level 1</span>
                <span id="player-gold" aria-label="Player Gold">💰 0</span>
            </div>
        </header>
        <section id="game-screen" aria-live="polite">
            <div id="lighting-overlay"></div>
            <svg id="scene-graphics" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
                <rect id="ground" x="0" y="300" width="800" height="100" fill="#4CAF50" />
                
                <!-- Expanded world layers -->
                <g id="background-landscape">
                    <rect x="0" y="0" width="800" height="300" fill="#87CEEB" /> <!-- Sky -->
                    <g id="mountain-range">
                        <polygon points="0,300 200,150 400,250 600,100 800,200 800,300" fill="#778899" opacity="0.7" />
                        <polygon points="0,300 300,180 500,280 700,130 800,230 800,300" fill="#708090" opacity="0.5" />
                    </g>
                </g>
                
                <rect id="explore-region" x="0" y="0" width="500" height="300" fill="transparent" class="interaction-region" />
                
                <g id="world-forest">
                    <g class="tree" transform="translate(50, 250)">
                        <rect x="0" y="0" width="30" height="50" fill="#8B4513" /> 
                        <polygon points="-20,0 15,-50 50,0" fill="#228B22" />
                    </g>
                    <g class="tree" transform="translate(150, 240)">
                        <rect x="0" y="0" width="25" height="40" fill="#8B4513" /> 
                        <polygon points="-15,0 12,-40 40,0" fill="#32CD32" />
                    </g>
                    <g class="tree" transform="translate(250, 260)">
                        <rect x="0" y="0" width="20" height="30" fill="#8B4513" /> 
                        <polygon points="-10,0 10,-30 30,0" fill="#3CB371" />
                    </g>
                </g>
                
                <g id="character-svg">
                    <rect x="100" y="250" width="50" height="50" fill="#FF9800" />
                    <circle cx="125" cy="230" r="20" fill="#FFB74D" />
                </g>
                
                <g id="enemy-svg" style="display: none;">
                    <rect x="600" y="250" width="40" height="40" fill="#9C27B0" />
                    <circle cx="620" cy="230" r="15" fill="#E040FB" />
                </g>

                <image id="sun-image" href="/Sun.png" x="400" y="50" width="100" height="100" />
            </svg>
            <div id="dialogue-box" aria-live="assertive" role="status"></div>
        </section>
        <div id="action-buttons">
            <button id="inventory-btn" aria-label="View inventory">Inventory</button>
        </div>
    </main>
    <dialog id="inventory-modal" aria-labelledby="inventory-title">
        <div class="inventory-container">
            <h2 id="inventory-title">Inventory</h2>
            <div id="inventory-scroll-container">
                <ul id="inventory-list" aria-live="polite"></ul>
            </div>
            <div class="inventory-stats">
                <p id="inventory-capacity"></p>
            </div>
            <button id="close-inventory-btn" aria-label="Close Inventory">Close</button>
        </div>
    </dialog>
    <script type="module" src="game.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
