<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm Quest: Hero's Journey</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="An interactive RPG adventure game">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%233498db'><text y='.9em' font-size='90'>🗡️</text></svg>">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <main id="game-container" role="main" aria-label="Realm Quest Game">
        <header id="game-header" role="banner">
            <h1>Realm Quest</h1>
            <div id="player-stats" aria-live="polite">
                <span id="player-health" aria-label="Player Health">❤️ 100</span>
                <span id="player-level" aria-label="Player Level">🔱 Level 1</span>
                <span id="player-gold" aria-label="Player Gold">💰 0</span>
            </div>
        </header>
        <section id="game-screen" aria-live="polite">
            <div id="character" aria-hidden="true"></div>
            <div id="world" aria-hidden="true"></div>
            <div id="dialogue-box" aria-live="assertive" role="status"></div>
        </section>
        <div id="action-buttons">
            <button id="explore-btn" aria-label="Explore the world">Explore</button>
            <button id="fight-btn" aria-label="Engage in combat">Fight</button>
            <button id="inventory-btn" aria-label="View inventory">Inventory</button>
        </div>
    </main>
    <script type="module" src="game.js"></script>

</body>
</html>
